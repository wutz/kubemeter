# This rule is not used by the project kubemeter itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to metering.paratera.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubemeter
    app.kubernetes.io/managed-by: kustomize
  name: resourceusage-viewer-role
rules:
- apiGroups:
  - metering.paratera.com
  resources:
  - resourceusages
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - metering.paratera.com
  resources:
  - resourceusages/status
  verbs:
  - get
