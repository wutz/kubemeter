# This rule is not used by the project kubemeter itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the metering.wutz.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubemeter
    app.kubernetes.io/managed-by: kustomize
  name: resourceusage-editor-role
rules:
- apiGroups:
  - metering.wutz.dev
  resources:
  - resourceusages
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - metering.wutz.dev
  resources:
  - resourceusages/status
  verbs:
  - get
