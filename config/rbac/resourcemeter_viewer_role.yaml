# This rule is not used by the project kubemeter itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to metering.wutz.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubemeter
    app.kubernetes.io/managed-by: kustomize
  name: resourcemeter-viewer-role
rules:
- apiGroups:
  - metering.wutz.dev
  resources:
  - resourcemeters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - metering.wutz.dev
  resources:
  - resourcemeters/status
  verbs:
  - get
